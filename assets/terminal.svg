<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" fill="none" role="img" aria-label="Terminal boot sequence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141826"/>
      <stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d2e"/>
      <stop offset="0.5" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#4b7dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;dominant-baseline:middle;}
      .prompt{fill:#4b7dff;}
      .cmd{fill:#e8eaf0;}
      .flag{fill:#8a2be2;}
      .str{fill:#ff4d2e;}
      .ok{fill:#3ddc84;}
      .dim{fill:#7c7f8a;}
      .line{opacity:0;}
      /* each line fades+slides in on its own delay */
      .l1{animation:in .35s ease-out .3s forwards;}
      .l2{animation:in .35s ease-out 1.1s forwards;}
      .l3{animation:in .35s ease-out 1.9s forwards;}
      .l4{animation:in .35s ease-out 2.7s forwards;}
      .l5{animation:in .35s ease-out 3.6s forwards;}
      .l6{animation:in .35s ease-out 4.4s forwards;}
      .l7{animation:in .35s ease-out 5.2s forwards;}
      .l8{animation:in .35s ease-out 6.0s forwards;}
      @keyframes in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
      .cursor{animation:blink 1s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      .scan{animation:scan 4.5s linear infinite;}
      @keyframes scan{0%{transform:translateY(60px);}100%{transform:translateY(420px);}}
      .barfill{animation:fill 1.4s ease-out 5.2s forwards;}
      @keyframes fill{from{width:0;}to{width:300px;}}
      .titleglow{animation:pulse 3s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.85;}50%{opacity:1;}}
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="418" rx="14" fill="url(#bg)" stroke="#20263a" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1" y="1" width="858" height="40" rx="14" fill="url(#titlebar)"/>
  <rect x="1" y="26" width="858" height="15" fill="url(#titlebar)"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="430" y="21" text-anchor="middle" font-size="13" class="dim titleglow">yeshwanth@swaa: ~/dev</text>

  <!-- scanline -->
  <rect class="scan" x="1" y="0" width="858" height="2" fill="#4b7dff" opacity="0.06"/>

  <!-- body -->
  <g font-size="16.5" filter="url(#glow)">
    <g class="line l1"><text x="26" y="72"><tspan class="prompt">➜</tspan> <tspan class="cmd">whoami</tspan></text></g>
    <g class="line l2"><text x="26" y="100"><tspan class="str">Yeshwanth</tspan> <tspan class="dim">— Creative-Technology &amp; Full-Stack Engineer</tspan></text></g>

    <g class="line l3"><text x="26" y="140"><tspan class="prompt">➜</tspan> <tspan class="cmd">cat</tspan> <tspan class="flag">stack.json</tspan></text></g>
    <g class="line l4"><text x="26" y="168"><tspan class="dim">{</tspan> <tspan class="str">"3d"</tspan><tspan class="dim">:</tspan> <tspan class="ok">"three.js · webgl · gsap"</tspan><tspan class="dim">,</tspan> <tspan class="str">"core"</tspan><tspan class="dim">:</tspan> <tspan class="ok">"react · node · python · go"</tspan> <tspan class="dim">}</tspan></text></g>

    <g class="line l5"><text x="26" y="208"><tspan class="prompt">➜</tspan> <tspan class="cmd">./deploy</tspan> <tspan class="flag">--projects</tspan> <tspan class="dim">swaa.life</tspan></text></g>
    <g class="line l6"><text x="26" y="236"><tspan class="dim">building immersive web · automation · AI agents</tspan></text></g>

    <!-- progress bar -->
    <g class="line l7">
      <rect x="26" y="256" width="300" height="10" rx="5" fill="#161a28"/>
      <rect class="barfill" x="26" y="256" width="0" height="10" rx="5" fill="url(#accent)"/>
      <text x="336" y="262" font-size="13" class="ok">deploy ok ✓</text>
    </g>

    <g class="line l8"><text x="26" y="306"><tspan class="prompt">➜</tspan> <tspan class="cmd">echo</tspan> <tspan class="str">"code becomes experience"</tspan><tspan class="cursor cmd" dx="6">▋</tspan></text></g>
  </g>

  <!-- accent underline -->
  <rect x="26" y="360" width="808" height="2" fill="url(#accent)" opacity="0.5"/>
  <text x="26" y="384" font-size="12" class="dim">◆ 3D WEB</text>
  <text x="150" y="384" font-size="12" class="dim">◆ AUTOMATION</text>
  <text x="300" y="384" font-size="12" class="dim">◆ AI AGENTS</text>
  <text x="834" y="384" font-size="12" text-anchor="end" class="dim titleglow">● online</text>
</svg>
